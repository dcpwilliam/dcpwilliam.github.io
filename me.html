        .header {

            padding: 8px 16px;

        }

            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .coming-soon {
            text-align: center;
            max-width: 500px;
        }
        .coming-soon-icon {
            font-size: 80px;
            margin-bottom: 30px;
        }
        .coming-soon h2 {
            font-size: 32px;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #00d4ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .coming-soon p {
            font-size: 16px;
            color: #8899aa;
            line-height: 1.8;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #00d4ff, #7b61ff);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }
