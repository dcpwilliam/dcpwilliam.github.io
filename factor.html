<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>因子探究 - EBI 循证投资</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #0a0e1a;
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            padding: 20px 30px;
            border-bottom: 1px solid #2a3441;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #00d4ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .lang-switcher {
            display: flex;
            gap: 8px;
        }
        .lang-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #2a3441;
            background: rgba(255, 255, 255, 0.05);
            color: #8899aa;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .lang-btn:hover {
            border-color: #00d4ff;
            color: #00d4ff;
        }
        .lang-btn.active {
            background: linear-gradient(90deg, #00d4ff, #7b61ff);
            border-color: transparent;
            color: #ffffff;
        }
        .header-links {
            display: flex;
            gap: 15px;
        }
        .header-links a {
            color: #8899aa;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .header-links a:hover {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }
        .header-links a.active {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.15);
        }
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .coming-soon {
            text-align: center;
            max-width: 500px;
        }
        .coming-soon-icon {
            font-size: 80px;
            margin-bottom: 30px;
        }
        .coming-soon h2 {
            font-size: 32px;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #00d4ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .coming-soon p {
            font-size: 16px;
            color: #8899aa;
            line-height: 1.8;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #00d4ff, #7b61ff);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }
        .loading {
            text-align: center;
            padding: 100px;
            font-size: 18px;
            color: #8899aa;
        }
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .stat-card {
            background: linear-gradient(135deg, #1a1f2e, #0f1419);
            border: 1px solid #2a3441;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 14px;
            color: #8899aa;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .factor-section {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .section-title {
            font-size: 20px;
            color: #00d4ff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a3441;
        }
        .factor-table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1f2e;
            border-radius: 12px;
            overflow: hidden;
        }
        .factor-table th {
            background: #0f1419;
            padding: 16px 12px;
            text-align: left;
            font-size: 14px;
            color: #00d4ff;
            border-bottom: 2px solid #2a3441;
        }
        .factor-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #2a3441;
            font-size: 14px;
        }
        .factor-table tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }
        .industry-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
        }
        .up { color: #00d4aa; }
        .down { color: #ff6b6b; }
    </style>
</head>
<body>
    <header class="header">
        <h1 id="page-title">🔬 因子探究</h1>
        <div class="header-right">
            <nav class="header-links">
                <a href="index.html" id="nav-home">首页</a>
                <a href="map.html" id="nav-map">市场雷达</a>
                <a href="simback.html" id="nav-simback">策略模拟</a>
                <a href="me.html" id="nav-me">个人信息</a>
                <a href="factor.html" class="active" id="nav-factor">因子探究</a>
            </nav>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="zh" onclick="switchLang('zh')">中文</button>
                <button class="lang-btn" data-lang="ja" onclick="switchLang('ja')">日本語</button>
                <button class="lang-btn" data-lang="en" onclick="switchLang('en')">English</button>
            </div>
        </div>
    </header>
    
    <main class="main-content" id="main-content">
        <div class="loading" id="loading">加载数据</div>
    </main>

    <script>
        const translations = {
            zh: {
                loading: '加载数据',
                pageTitle: '🔬 因子探究',
                backLink: '← 返回首页',
                navHome: '首页',
                navMap: '市场雷达',
                navSimback: '策略模拟',
                navMe: '个人信息',
                navFactor: '因子探究',
                totalStocks: '股票总数',
                avgPE: '平均市盈率',
                avgPB: '平均市净率',
                avgROE: '平均净资产收益率',
                factorAnalysis: '因子分析',
                stockCode: '代码',
                stockName: '名称',
                industry: '行业',
                price: '价格',
                pe: '市盈率',
                pb: '市净率',
                roe: '净资产收益率',
                marketCap: '市值',
                change: '涨跌幅',
                rankByPE: '按市盈率排序',
                rankByPB: '按市净率排序',
                rankByROE: '按ROE排序'
            },
            ja: {
                loading: 'データ読み込み中',
                pageTitle: '🔬 ファクター分析',
                backLink: '← ホームに戻る',
                navHome: 'ホーム',
                navMap: '市場レーダー',
                navSimback: '戦略シミュレーション',
                navMe: '個人情報',
                navFactor: 'ファクター分析',
                totalStocks: '株式総数',
                avgPE: '平均PER',
                avgPB: '平均PBR',
                avgROE: '平均ROE',
                factorAnalysis: 'ファクター分析',
                stockCode: 'コード',
                stockName: '名前',
                industry: '業種',
                price: '価格',
                pe: 'PER',
                pb: 'PBR',
                roe: 'ROE',
                marketCap: '時価総額',
                change: '変動率',
                rankByPE: 'PER順',
                rankByPB: 'PBR順',
                rankByROE: 'ROE順'
            },
            en: {
                loading: 'Loading',
                pageTitle: '🔬 Factor Analysis',
                backLink: '← Back to Home',
                navHome: 'Home',
                navMap: 'Market Radar',
                navSimback: 'Strategy Simulation',
                navMe: 'Profile',
                navFactor: 'Factor Analysis',
                totalStocks: 'Total Stocks',
                avgPE: 'Avg PE',
                avgPB: 'Avg PB',
                avgROE: 'Avg ROE',
                factorAnalysis: 'Factor Analysis',
                stockCode: 'Code',
                stockName: 'Name',
                industry: 'Industry',
                price: 'Price',
                pe: 'PE Ratio',
                pb: 'PB Ratio',
                roe: 'ROE',
                marketCap: 'Market Cap',
                change: 'Change',
                rankByPE: 'Sort by PE',
                rankByPB: 'Sort by PB',
                rankByROE: 'Sort by ROE'
            }
        };

        let currentLang = 'zh';
        let apiData = null;

        async function loadData() {
            try {
                const response = await fetch('https://console.authing.cn/webhook/2fd05435-b258-44f7-b5ae-760565ff646a');
                const result = await response.json();
                
                if (result.data && result.data.output && result.data.output.data) {
                    const content = result.data.output.data.data.content;
                    apiData = parseApiData(content);
                    renderFactorPage();
                }
            } catch (error) {
                console.error('Failed to load data:', error);
                document.getElementById('main-content').innerHTML = '<div class="loading">数据加载失败，请刷新页面</div>';
            }
        }

        function parseApiData(content) {
            const industries = [];
            const themes = [];
            const stocks = [];

            if (content.industries) {
                content.industries.forEach(ind => {
                    industries.push({
                        name: ind.name || ind.name_en || '',
                        code: ind.code || '',
                        stockCount: ind.stock_count || ind.stockCount || 0
                    });
                });
            }

            if (content.themes) {
                content.themes.forEach(theme => {
                    themes.push({
                        name: theme.name || theme.name_en || '',
                        code: theme.code || '',
                        stockCount: theme.stock_count || theme.stockCount || 0
                    });
                });
            }

            if (content.stocks) {
                content.stocks.forEach(stock => {
                    stocks.push({
                        code: stock.code || stock.scode || '',
                        name: stock.name || stock.sname || '',
                        industry: stock.industry || '',
                        price: parseFloat(stock.price) || 0,
                        pe: parseFloat(stock.pe) || 0,
                        pb: parseFloat(stock.pb) || 0,
                        roe: parseFloat(stock.roe) || 0,
                        marketCap: parseFloat(stock.market_cap || stock.marketCap) || 0,
                        change: parseFloat(stock.change) || 0
                    });
                });
            }

            return { industries, themes, stocks };
        }

        function renderFactorPage() {
            const t = translations[currentLang];
            const stats = calculateStats();
            
            let html = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="label">${t.totalStocks}</div>
                        <div class="value">${stats.totalStocks}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">${t.avgPE}</div>
                        <div class="value">${stats.avgPE.toFixed(2)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">${t.avgPB}</div>
                        <div class="value">${stats.avgPB.toFixed(2)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">${t.avgROE}</div>
                        <div class="value">${stats.avgROE.toFixed(2)}%</div>
                    </div>
                </div>
                
                <div class="factor-section">
                    <h3 class="section-title">${t.factorAnalysis}</h3>
                    <table class="factor-table">
                        <thead>
                            <tr>
                                <th>${t.stockCode}</th>
                                <th>${t.stockName}</th>
                                <th>${t.industry}</th>
                                <th>${t.price}</th>
                                <th>${t.pe}</th>
                                <th>${t.pb}</th>
                                <th>${t.roe}</th>
                                <th>${t.marketCap}</th>
                                <th>${t.change}</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            apiData.stocks.slice(0, 50).forEach(stock => {
                const changeClass = stock.change >= 0 ? 'up' : 'down';
                const changeSign = stock.change >= 0 ? '+' : '';
                html += `
                            <tr>
                                <td>${stock.code}</td>
                                <td>${stock.name}</td>
                                <td><span class="industry-tag">${stock.industry}</span></td>
                                <td>¥${stock.price.toFixed(2)}</td>
                                <td>${stock.pe > 0 ? stock.pe.toFixed(2) : '-'}</td>
                                <td>${stock.pb > 0 ? stock.pb.toFixed(2) : '-'}</td>
                                <td>${stock.roe > 0 ? stock.roe.toFixed(2) + '%' : '-'}</td>
                                <td>${(stock.marketCap / 100000000).toFixed(2)}亿</td>
                                <td class="${changeClass}">${changeSign}${stock.change.toFixed(2)}%</td>
                            </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
                <div style="padding: 30px; text-align: center;">
                    <a href="index.html" class="back-link">${t.backLink}</a>
                </div>
            `;

            document.getElementById('main-content').innerHTML = html;
        }

        function calculateStats() {
            if (!apiData || !apiData.stocks.length) {
                return { totalStocks: 0, avgPE: 0, avgPB: 0, avgROE: 0 };
            }

            const stocks = apiData.stocks;
            const validPE = stocks.filter(s => s.pe > 0);
            const validPB = stocks.filter(s => s.pb > 0);
            const validROE = stocks.filter(s => s.roe > 0);

            return {
                totalStocks: stocks.length,
                avgPE: validPE.length ? validPE.reduce((sum, s) => sum + s.pe, 0) / validPE.length : 0,
                avgPB: validPB.length ? validPB.reduce((sum, s) => sum + s.pb, 0) / validPB.length : 0,
                avgROE: validROE.length ? validROE.reduce((sum, s) => sum + s.roe, 0) / validROE.length : 0
            };
        }

        function switchLang(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('page-title').textContent = t.pageTitle;
            document.getElementById('nav-home').textContent = t.navHome;
            document.getElementById('nav-map').textContent = t.navMap;
            document.getElementById('nav-simback').textContent = t.navSimback;
            document.getElementById('nav-me').textContent = t.navMe;
            document.getElementById('nav-factor').textContent = t.navFactor;
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
            
            localStorage.setItem('ebi-lang', lang);
            
            if (apiData) {
                renderFactorPage();
            }
        }

        window.addEventListener('load', async () => {
            const savedLang = localStorage.getItem('ebi-lang') || 'zh';
            currentLang = savedLang;
            switchLang(savedLang);
            await loadData();
        });
    </script>
</body>
</html>
