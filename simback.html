<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策略模拟 - EBI 循证投资</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #0a0e1a;
            color: #e0e6ed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1419 100%);
            padding: 20px 30px;
            border-bottom: 1px solid #2a3441;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #00d4ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .lang-switcher {
            display: flex;
            gap: 8px;
        }
        .lang-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #2a3441;
            background: rgba(255, 255, 255, 0.05);
            color: #8899aa;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .lang-btn:hover {
            border-color: #00d4ff;
            color: #00d4ff;
        }
        .lang-btn.active {
            background: linear-gradient(90deg, #00d4ff, #7b61ff);
            border-color: transparent;
            color: #ffffff;
        }
        .header-links {
            display: flex;
            gap: 15px;
        }
        .header-links a {
            color: #8899aa;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .header-links a:hover {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }
        .header-links a.active {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.15);
        }
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .coming-soon {
            text-align: center;
            max-width: 500px;
        }
        .coming-soon-icon {
            font-size: 80px;
            margin-bottom: 30px;
        }
        .coming-soon h2 {
            font-size: 32px;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #00d4ff, #7b61ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .coming-soon p {
            font-size: 16px;
            color: #8899aa;
            line-height: 1.8;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #00d4ff, #7b61ff);
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 id="page-title">🎮 策略模拟</h1>
        <div class="header-right">
            <nav class="header-links">
                <a href="index.html" id="nav-home">首页</a>
                <a href="map.html" id="nav-map">市场雷达</a>
                <a href="simback.html" class="active" id="nav-simback">策略模拟</a>
                <a href="me.html" id="nav-me">个人信息</a>
                <a href="factor.html" id="nav-factor">因子探究</a>
            </nav>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="zh" onclick="switchLang('zh')">中文</button>
                <button class="lang-btn" data-lang="ja" onclick="switchLang('ja')">日本語</button>
                <button class="lang-btn" data-lang="en" onclick="switchLang('en')">English</button>
            </div>
        </div>
    </header>
    
    <main class="main-content">
        <div class="coming-soon">
            <div class="coming-soon-icon">🎮</div>
            <h2 id="page-subtitle">策略模拟</h2>
            <p id="page-desc">
                模拟交易与回测验证<br>
                在真实环境中检验策略有效性<br>
                降低实盘风险，提升投资能力
            </p>
            <a href="index.html" class="back-link" id="back-link">← 返回首页</a>
        </div>
    </main>

    <script>
        const translations = {
            zh: {
                pageTitle: '🎮 策略模拟',
                pageSubtitle: '策略模拟',
                pageDesc: '模拟交易与回测验证\n在真实环境中检验策略有效性\n降低实盘风险，提升投资能力',
                backLink: '← 返回首页',
                navHome: '首页',
                navMap: '市场雷达',
                navSimback: '策略模拟',
                navMe: '个人信息',
                navFactor: '因子探究'
            },
            ja: {
                pageTitle: '🎮 戦略シミュレーション',
                pageSubtitle: '戦略シミュレーション',
                pageDesc: '模擬取引とバックテスト検証\n実際の環境で戦略の有効性を検証\n実取引リスクを低減し、投資能力を向上',
                backLink: '← ホームに戻る',
                navHome: 'ホーム',
                navMap: '市場レーダー',
                navSimback: '戦略シミュレーション',
                navMe: '個人情報',
                navFactor: 'ファクター分析'
            },
            en: {
                pageTitle: '🎮 Strategy Simulation',
                pageSubtitle: 'Strategy Simulation',
                pageDesc: 'Simulated trading and backtesting validation\nVerify strategy effectiveness in real environment\nReduce live trading risk, improve investment skills',
                backLink: '← Back to Home',
                navHome: 'Home',
                navMap: 'Market Radar',
                navSimback: 'Strategy Simulation',
                navMe: 'Profile',
                navFactor: 'Factor Analysis'
            }
        };

        function switchLang(lang) {
            const t = translations[lang];
            document.getElementById('page-title').textContent = t.pageTitle;
            document.getElementById('page-subtitle').textContent = t.pageSubtitle;
            document.getElementById('page-desc').innerHTML = t.pageDesc.replace(/\n/g, '<br>');
            document.getElementById('back-link').textContent = t.backLink;
            document.getElementById('nav-home').textContent = t.navHome;
            document.getElementById('nav-map').textContent = t.navMap;
            document.getElementById('nav-simback').textContent = t.navSimback;
            document.getElementById('nav-me').textContent = t.navMe;
            document.getElementById('nav-factor').textContent = t.navFactor;
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
            
            localStorage.setItem('ebi-lang', lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('ebi-lang') || 'zh';
            switchLang(savedLang);
        });
    </script>
</body>
</html>
