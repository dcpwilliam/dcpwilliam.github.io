<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Timeline · OIDC 服务</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f6fa;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; color: #1b1f33; padding: 24px; }
  .box { max-width: 520px; background: #fff; border-radius: 18px; padding: 28px; box-shadow: 0 10px 30px rgba(27,31,51,.08); }
  h1 { font-size: 20px; margin: 0 0 14px; }
  p { font-size: 13px; color: #4a5168; line-height: 1.9; margin: 6px 0; }
  code { background: #f7f8fc; padding: 2px 6px; border-radius: 5px; font-size: 12px; }
  ul { font-size: 13px; color: #4a5168; line-height: 2; padding-left: 20px; }
</style>
</head>
<body>
<div class="box">
  <h1>Timeline · OIDC 登录服务</h1>
  <p>这个服务是小程序登录的后端，持有 App Secret 并完成 code → token 的交换。</p>
  <ul>
    <li><code>GET /health</code> 健康检查</li>
    <li><code>GET /oidc/authorize-url</code> 生成 PKCE 与授权地址</li>
    <li><code>POST /oidc/token</code> 用 code 换 token</li>
    <li><code>GET /oidc/me</code> 代理用户信息</li>
    <li><code>GET /oidc/logout-url</code> 生成登出地址</li>
  </ul>
  <p>回调页：<code>/oidc/callback</code>（供小程序 web-view 使用）</p>
</div>
</body>
</html>
